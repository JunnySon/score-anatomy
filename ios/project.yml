# 모고칸(저장소 score-anatomy) iOS 앱 껍데기의 XcodeGen 설정. 앱 이름(홈 화면 이름)은 2026-11-24 에 모고칸으로 정했다.
# 프로젝트 파일(ScoreAnatomy.xcodeproj)은 이 파일로 만들고 둘 다 커밋한다. 손으로 고치지 않는다.
# 다시 만드는 법과 주의할 점(서명 팀이 지워지지 않게 하는 법)은 ios/README.md 에 있다.
name: ScoreAnatomy

options:
  bundleIdPrefix: com.junnyson
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  groupSortPosition: top
  transitivelyLinkDependencies: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "1"
    # 서명 팀(DEVELOPMENT_TEAM)과 번들 ID(SA_BUNDLE_ID)는 Config/Shared.xcconfig 에 둔다.
    # 여기에 적으면 xcconfig 보다 앞서서 Config/Signing.local.xcconfig 로 덮어쓸 수 없게 된다(README 참고).
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

targets:
  ScoreAnatomy:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ScoreAnatomy
        excludes:
          - "Web/**"
          - "Info.plist"
      # 웹 묶음은 폴더째 싣는다. 어느 쪽을 실을지는 아래 EXCLUDED_SOURCE_FILE_NAMES 로 고른다.
      - path: ScoreAnatomy/Web/app-test
        type: folder
        buildPhase: resources
      - path: ScoreAnatomy/Web/app-release
        type: folder
        buildPhase: resources
      - path: ScoreAnatomy/Web/manifest.json
        buildPhase: resources
    info:
      path: ScoreAnatomy/Info.plist
      properties:
        CFBundleDisplayName: 모고칸
        # 시험 자료를 받는 주소(작업 지시서 4의 3-3). 값은 Config/Shared.xcconfig 의 SA_EXAM_BASE_URL 한 곳에서 온다.
        SAExamBaseURL: $(SA_EXAM_BASE_URL)
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    postBuildScripts:
      # 시험 자료 공개 키(exam-data/public-key.txt, 공개 키의 자리는 이 한 곳뿐)를 앱에 넣는다(작업 지시서 4의 3-3).
      # 파일이 없으면 빈 파일을 넣어 앱이 받기를 하지 않는다. Release 에서 테스트 전용 키면 빌드가 실패한다.
      - name: 시험 자료 공개 키 넣기
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/exam_key.py
          - $(SRCROOT)/../exam-data/public-key.txt
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/exam-public-key.txt
        script: python3 "${SRCROOT}/scripts/exam_key.py" install
      # Release 빌드에서 앱 안의 파일을 모두 훑어 테스트 전용 키가 있으면 빌드를 실패시킨다(3-1 의 3번).
      # 빌드 스크립트 샌드박스는 입력으로 적은 파일만 읽게 해서, 앱 안의 파일을 하나씩 적는다. 여기 없는 파일이 앱에 생기면 빌드가 실패한다.
      - name: 배포용 앱의 테스트 키 검사
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/exam_key.py
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/PkgInfo
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Assets.car
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon60x60@2x.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon76x76@2x~ipad.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PrivacyInfo.xcprivacy
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/manifest.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/app-release/index.html
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/exam-public-key.txt
        script: python3 "${SRCROOT}/scripts/exam_key.py" scan
    settings:
      base:
        PRODUCT_NAME: ScoreAnatomy
        PRODUCT_BUNDLE_IDENTIFIER: $(SA_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScoreAnatomy/Info.plist
        SUPPORTS_MACCATALYST: NO
      configs:
        # Debug 는 시험용 묶음(app-test)만, Release 는 배포용 묶음(app-release)만 싣는다.
        # Release 에서는 DEBUG 전용 코드 파일(Debug 폴더의 Debug*.swift)도 빌드에서 뺀다.
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: "app-release"
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "app-test Debug*.swift"

  ScoreAnatomyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ScoreAnatomyTests
    dependencies:
      - target: ScoreAnatomy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  ScoreAnatomyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ScoreAnatomyUITests
    dependencies:
      - target: ScoreAnatomy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SA_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: ScoreAnatomy

schemes:
  ScoreAnatomy:
    build:
      targets:
        ScoreAnatomy: all
        ScoreAnatomyTests: [test]
        ScoreAnatomyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ScoreAnatomyTests
        - name: ScoreAnatomyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
